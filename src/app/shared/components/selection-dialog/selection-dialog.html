<div class="dialog-container">
  <h2 mat-dialog-title>{{ title() }}</h2>
  <mat-dialog-content>
    <div class="checkbox-list">
      @for (item of items(); track item.id; let i = $index) {
        <mat-checkbox [checked]="item.selected" (change)="toggleItem(i)">
          <div class="item-info">
            <span class="item-nombre">{{ item.nombre }}</span>
            <span class="item-descripcion">{{ item.descripcion }}</span>
          </div>
        </mat-checkbox>
      } @empty {
        <p class="empty-message">No hay elementos disponibles.</p>
      }
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button matButton="outlined" class="btn-secondary" (click)="onCancel()">
      Cancelar
    </button>
    <button
      matButton="filled"
      [disabled]="!hasSelection()"
      (click)="onConfirm()"
    >
      Aceptar
    </button>
  </mat-dialog-actions>
</div>
