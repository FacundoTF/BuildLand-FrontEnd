<div id="usuario-info">
  <mat-icon>account_circle</mat-icon>
  <div id="usuario-nombre">
    {{ this.obtenerNombreUsuario() }}
  </div>
</div>
<div id="Permissions">
  <div id="G-Di" class="Gestion">
    <button
      matButton="filled"
      (click)="ToogleGestion('G-Di')"
      class="OpcionGestion sidebar-btn"
      [class.active]="activeButton() === 'G-Di'"
    >
      Gestionar Distribuidoras
    </button>
    <button
      matButton="filled"
      id="A-Di"
      (click)="AgregarDistribuidora()"
      class="Opcion sidebar-btn"
      [class.active]="activeButton() === 'A-Di'"
    >
      Agregar distribuidora
    </button>
    <button
      matButton="filled"
      id="R-Di"
      (click)="RemoverDistribuidora()"
      class="Opcion sidebar-btn"
      [class.active]="activeButton() === 'R-Di'"
    >
      Remover distribuidora
    </button>
    <button
      matButton="filled"
      id="M-Di"
      (click)="ModificarDistribuidora()"
      class="Opcion sidebar-btn"
      [class.active]="activeButton() === 'M-Di'"
    >
      Modificar distribuidora
    </button>
  </div>
  <div id="G-Pf" class="Gestion">
    <button
      mat-flat-button
      (click)="ToogleGestion('G-Pf')"
      class="OpcionGestion sidebar-btn"
      [class.active]="activeButton() === 'G-Pf'"
    >
      Gestionar personas fisicas
    </button>
    <button
      matButton="filled"
      id="A-Pf"
      (click)="AgregarPersonaFisica()"
      class="Opcion sidebar-btn"
      [class.active]="activeButton() === 'A-Pf'"
    >
      Agregar persona física
    </button>
    <button
      matButton="filled"
      id="R-Pf"
      (click)="RemoverPersonaFisica()"
      class="Opcion sidebar-btn"
      [class.active]="activeButton() === 'R-Pf'"
    >
      Remover persona fisica
    </button>
    <button
      matButton="filled"
      id="M-Pf"
      (click)="ModificarPersonaFisica()"
      class="Opcion sidebar-btn"
      [class.active]="activeButton() === 'M-Pf'"
    >
      Modificar persona fisica
    </button>
  </div>
  <div id="G-Gr" class="Gestion">
    <button
      mat-flat-button
      (click)="ToogleGestion('G-Gr')"
      class="OpcionGestion sidebar-btn"
      [class.active]="activeButton() === 'G-Gr'"
    >
      Gestionar grupos
    </button>
    <button
      matButton="filled"
      id="A-Gr"
      (click)="AgregarGrupo()"
      class="Opcion sidebar-btn"
      [class.active]="activeButton() === 'A-Gr'"
    >
      Agregar grupos
    </button>
    <button
      matButton="filled"
      id="R-Gr"
      (click)="RemoverGrupo()"
      class="Opcion sidebar-btn"
      [class.active]="activeButton() === 'R-Gr'"
    >
      Remover grupos
    </button>
    <button
      matButton="filled"
      id="M-Gr"
      (click)="ModificarGrupo()"
      class="Opcion sidebar-btn"
      [class.active]="activeButton() === 'M-Gr'"
    >
      Modificar grupos
    </button>
  </div>
  <div id="G-Pr" class="Gestion">
    <button
      matButton="filled"
      id="Z-Pr"
      (click)="RealizarPresupuesto()"
      class="OpcionNoPlegable sidebar-btn"
      [class.active]="activeButton() === 'Z-Pr'"
    >
      Realizar presupuesto
    </button>
    <button
      matButton="filled"
      id="Y-Pr"
      class="OpcionNoPlegable sidebar-btn"
      [class.active]="activeButton() === 'Y-Pr'"
      (click)="RecibirPresupuesto()"
    >
      Gestionar presupuestos actuales
    </button>
  </div>
  <div id="G-X" class="Gestion">
    <button
      matButton="filled"
      id="P-X"
      (click)="ReporteProductosMasSolicitados()"
      class="OpcionNoPlegable sidebar-btn"
      [class.active]="activeButton() === 'P-X'"
    >
      Reporte productos más solicitados
    </button>
    <button
      matButton="filled"
      id="C-X"
      (click)="ReporteCotizacionesPerdidasYGanadas()"
      class="OpcionNoPlegable sidebar-btn"
      [class.active]="activeButton() === 'C-X'"
    >
      Reporte cotizaciones ganadas y perdidas
    </button>
    <button
      matButton="filled"
      id="T-X"
      (click)="ReporteTrazabilidad()"
      class="OpcionNoPlegable sidebar-btn"
      [class.active]="activeButton() === 'T-X'"
    >
      Reporte inicios y cierres de sesión
    </button>
  </div>
  <div id="G-Us" class="Gestion">
    <button
      mat-flat-button
      (click)="ToogleGestion('G-Us')"
      class="OpcionGestion sidebar-btn"
      [class.active]="activeButton() === 'G-Us'"
    >
      Gestionar usuarios
    </button>
    <button
      matButton="filled"
      id="A-Us"
      (click)="AgregarUsuario()"
      class="Opcion sidebar-btn"
      [class.active]="activeButton() === 'A-Us'"
    >
      Agregar usuario
    </button>
    <button
      matButton="filled"
      id="R-Us"
      (click)="RemoverUsuario()"
      class="Opcion sidebar-btn"
      [class.active]="activeButton() === 'R-Us'"
    >
      Remover usuario
    </button>
    <button
      matButton="filled"
      id="M-Us"
      (click)="ModificarUsuario()"
      class="Opcion sidebar-btn"
      [class.active]="activeButton() === 'M-Us'"
    >
      Modificar usuario
    </button>
    <button
      matButton="filled"
      id="Z-Us"
      (click)="ResetearClave()"
      class="Opcion sidebar-btn"
      [class.active]="activeButton() === 'Z-Us'"
    >
      Resetear clave
    </button>
  </div>

  <div class="Gestion">
    <button
      matButton="filled"
      id="CerrarSesion"
      class="sidebar-btn"
      (click)="CerrarSesion()"
    >
      Cerrar sesión
    </button>
  </div>
</div>
