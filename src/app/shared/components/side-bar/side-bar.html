<div id="Permissions">
  <div id="G-DI" class="Gestion">
    <button (click)="ToogleGestion('G-DI')" class="OpcionNoPlegable">
      Gestionar Distribuidoras
    </button>
    <button id="A-DI" (click)="AgregarDistribuidora()" class="Opcion">
      Agregar distribuidora
    </button>
    <button id="R-DI" (click)="RemoverDistribuidora()" class="Opcion">
      Remover distribuidora
    </button>
    <button id="M-DI" (click)="ModificarDistribuidora()" class="Opcion">
      Modificar distribuidora
    </button>
  </div>
  <div id="G-PF" class="Gestion">
    <button (click)="ToogleGestion('G-PF')" class="OpcionNoPlegable">
      Gestionar personas fisicas
    </button>
    <button id="A-PF" (click)="AgregarPersonaFisica()" class="Opcion">
      Agregar persona física
    </button>
    <button id="R-PF" (click)="RemoverPersonaFisica()" class="Opcion">
      Remover persona fisica
    </button>
    <button id="M-PF" (click)="ModificarPersonaFisica()" class="Opcion">
      Modificar persona fisica
    </button>
  </div>
  <div id="G-Pr" class="Gestion">
    <button id="R-Pr" (click)="RealizarPresupuesto()" class="OpcionNoPlegable">Realizar presupuesto</button>
  </div>
  <div class="Gestion">
    <button id="CerrarSesion" (click)="CerrarSesion()">Cerrar sesión</button>
  </div>
</div>
