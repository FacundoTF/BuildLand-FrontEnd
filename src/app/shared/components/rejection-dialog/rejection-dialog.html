<h2 mat-dialog-title>Seleccione motivo de rechazo</h2>
<mat-dialog-content>
  @if (loading()) {
    <div class="loading-container">
      <mat-spinner diameter="50"></mat-spinner>
    </div>
  } @else {
    @if (messages().length > 0) {
      <div class="messages-container">
        <mat-radio-group [(ngModel)]="selectedMessageId">
          @for (msg of messages(); track msg.idMensaje) {
            <mat-radio-button [value]="msg.idMensaje">
              {{ msg.mensaje }}
            </mat-radio-button>
          }
        </mat-radio-group>
      </div>
    } @else {
      <div class="no-messages">
        <p>No se encontraron motivos de rechazo.</p>
      </div>
    }
  }
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button
    mat-flat-button
    color="warn"
    [disabled]="loading() || messages().length === 0 || !selectedMessageId()"
    (click)="onConfirm()"
  >
    Aceptar
  </button>
</mat-dialog-actions>
