<div class="dialog-container">
  <h2 mat-dialog-title>{{ title() }}</h2>
  <mat-dialog-content>
    <p>{{ message() }}</p>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    @if (showCancel()) {
      <button matButton="outlined" class="btn-secondary" (click)="onCancel()">{{ cancelText() }}</button>
    }
    <button matButton="filled" (click)="onConfirm()">
      {{ confirmText() }}
    </button>
  </mat-dialog-actions>
</div>
