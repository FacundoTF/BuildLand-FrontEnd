<div class="container">
  <div id="content">
    @for (p of presupuestos; track p.id){
      <mat-card>
        <mat-card-header>
          <mat-card-title>Presupuesto: {{sumarContador()}}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <p>Fecha de creación: {{p.fecha}}</p>
          <p>Fecha limite: {{p.fechaLimite}}</p>
        </mat-card-content>
        <mat-card-actions>
          <button matButton="filled">Ver Detalles</button>
          <!--          <button mat-button color="primary" (click)="aprobarPresupuesto(p.id)" *ngIf="p.estado === 'Pendiente'">Aprobar</button>-->
          <!--          <button mat-button color="warn" (click)="rechazarPresupuesto(p.id)" *ngIf="p.estado === 'Pendiente'">Rechazar</button>-->
        </mat-card-actions>
      </mat-card>
    }
  </div>
</div>
