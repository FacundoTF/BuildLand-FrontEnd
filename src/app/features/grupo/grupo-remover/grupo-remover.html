<div class="container">
  <div id="content">
    <h2>Eliminar Grupo</h2>

    <div class="grupo-list">
      @if (grupos().length > 0) {
        <div class="tabla-container">
          <table mat-table [dataSource]="grupos()" class="mat-elevation-z8">
            <ng-container matColumnDef="nombre">
              <th mat-header-cell *matHeaderCellDef>Nombre de grupo</th>
              <td mat-cell *matCellDef="let grupo">{{ grupo.nombre }}</td>
            </ng-container>

            <ng-container matColumnDef="descripcion">
              <th mat-header-cell *matHeaderCellDef>Descripción</th>
              <td mat-cell *matCellDef="let grupo">{{ grupo.descripcion }}</td>
            </ng-container>

            <ng-container matColumnDef="acciones">
              <th mat-header-cell *matHeaderCellDef>Acciones</th>
              <td mat-cell *matCellDef="let grupo">
                <button
                  mat-icon-button
                  color="warn"
                  (click)="confirmarEliminar(grupo)"
                  type="button"
                  aria-label="Eliminar grupo"
                >
                  <mat-icon>delete</mat-icon>
                </button>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          </table>
        </div>
      } @else {
        <div class="empty-state">
          <p>No hay grupos disponibles para eliminar.</p>
        </div>
      }
    </div>
  </div>
</div>
