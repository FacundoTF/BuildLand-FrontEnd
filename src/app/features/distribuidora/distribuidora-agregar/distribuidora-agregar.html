<div class="container">
  <h2>Agregar Nueva Distribuidora</h2>

  <form
    [formGroup]="distribuidoraForm"
    (ngSubmit)="handleSubmit()"
    class="distribuidora-form"
  >
    <div class="form-group">
      <label for="cuit">CUIT</label>
      <input
        type="text"
        id="cuit"
        name="cuit"
        placeholder="Ingrese el CUIT (ej: 20-12345678-9)"
        formControlName="cuit"
        required
      />
    </div>

    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input
        type="text"
        id="nombre"
        name="nombre"
        placeholder="Ingrese el nombre de la distribuidora"
        formControlName="nombre"
        required
      />
    </div>

    <div class="form-group">
      <label for="direccion">Dirección</label>
      <input
        type="text"
        id="direccion"
        name="direccion"
        placeholder="Ingrese la dirección completa"
        formControlName="direccion"
        required
      />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="numeroTelefono">Número de Teléfono</label>
        <input
          type="tel"
          id="numeroTelefono"
          name="numeroTelefono"
          placeholder="Ingrese el número de teléfono"
          formControlName="numeroTelefono"
          required
        />
      </div>

      <div class="form-group">
        <label for="codigoPostal">Código Postal</label>
        <input
          type="text"
          id="codigoPostal"
          name="codigoPostal"
          placeholder="Ingrese el código postal"
          formControlName="codigoPostal"
          required
        />
      </div>
    </div>

    <div class="form-group">
      <label for="ciudad">Ciudad</label>
      <input
        type="text"
        id="ciudad"
        name="ciudad"
        placeholder="Ingrese la ciudad"
        formControlName="ciudad"
        required
      />
    </div>

    <div class="form-group">
      <label for="descripcion">Descripción</label>
      <input
        id="descripcion"
        name="descripcion"
        placeholder="Ingrese una descripción de la distribuidora"
        rows="4"
        formControlName="descripcion"
        required
      />
    </div>

    <div class="form-group">
      <label>Categorías</label>
      <div class="categorias-container">
        <div
          *ngFor="let categoria of categorias"
          class="categoria-item"
          (click)="toggleCategoria(categoria.nombre)"
          [class.selected]="isCategoriaSeleccionada(categoria.nombre)"
        >
          <input
            type="checkbox"
            [checked]="isCategoriaSeleccionada(categoria.nombre)"
            [id]="'categoria-' + categoria.nombre"
            readonly
          />
          <label [for]="'categoria-' + categoria.nombre">{{
            categoria.nombre
          }}</label>
        </div>
      </div>
      <small
        *ngIf="categoriasSeleccionadas.length === 0"
        class="error-message"
      >
        Debe seleccionar al menos una categoría
      </small>
    </div>

    <div class="form-group">
      <label for="correoElectronico">Correo Electrónico</label>
      <input
        type="email"
        id="correoElectronico"
        name="correoElectronico"
        placeholder="Ingrese el correo electrónico"
        formControlName="correoElectronico"
        required
      />
    </div>

    <div class="form-group">
      <label for="contraseña">Contraseña</label>
      <input
        type="password"
        id="contraseña"
        name="contraseña"
        placeholder="Ingrese la contraseña"
        formControlName="contraseña"
        required
      />
    </div>

    <div class="form-actions">
      <button
        [disabled]="!distribuidoraForm.valid"
        type="submit"
        class="btn-primary"
      >
        Agregar Distribuidora
      </button>
      <button type="reset" class="btn-secondary">Limpiar</button>
    </div>
  </form>
</div>
