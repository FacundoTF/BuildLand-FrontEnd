<div class="container">
  <div id="content">
    <h2>Modificar Distribuidora</h2>

    <!-- Contenedor para buscar distribuidora por CUIT -->
    <div class="search-container">
      <h3>Buscar Distribuidora</h3>
      <form
        [formGroup]="distribuidoraCuit"
        (ngSubmit)="handleSubmitCuit()"
        class="search-form"
      >
        <div class="form-group">
          <label for="searchCuit">CUIT de la Distribuidora</label>
          <input
            type="text"
            id="searchCuit"
            name="searchCuit"
            placeholder="Ingrese el CUIT para buscar (ej: 20-12345678-9)"
            formControlName="cuit"
            required
          />
        </div>
        <div class="search-actions">
          <button type="submit" class="btn-search">Buscar Distribuidora</button>
        </div>
      </form>
    </div>

    <!-- Contenedor para modificar datos (inicialmente oculto) -->
    <div class="edit-container is-hidden">
      <h3>Datos de la Distribuidora</h3>
      <form
        [formGroup]="distribuidoraForm"
        (ngSubmit)="handleModify()"
        class="distribuidora-form"
      >
        <div class="form-group">
          <label for="cuit">CUIT</label>
          <input
            type="text"
            id="cuit"
            name="cuit"
            placeholder="CUIT de la distribuidora"
            formControlName="cuit"
            readonly
          />
        </div>

        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Ingrese el nombre de la distribuidora"
            formControlName="nombre"
            required
          />
        </div>

        <div class="form-group">
          <label for="direccion">Dirección</label>
          <input
            type="text"
            id="direccion"
            name="direccion"
            placeholder="Ingrese la dirección completa"
            formControlName="direccion"
            required
          />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="numeroTelefono">Número de Teléfono</label>
            <input
              type="tel"
              id="numeroTelefono"
              name="numeroTelefono"
              placeholder="Ingrese el número de teléfono"
              formControlName="numeroTelefono"
              required
            />
          </div>

          <div class="form-group">
            <label for="codigoPostal">Código Postal</label>
            <input
              type="text"
              id="codigoPostal"
              name="codigoPostal"
              placeholder="Ingrese el código postal"
              formControlName="codigoPostal"
              required
            />
          </div>

          <div class="form-group">
            <label for="ciudad">Código Postal</label>
            <input
              type="text"
              id="ciudad"
              name="ciudad"
              placeholder="Ingrese el código postal"
              formControlName="ciudad"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="descripcion">Descripción</label>
          <textarea
            id="descripcion"
            name="descripcion"
            placeholder="Ingrese una descripción de la distribuidora"
            formControlName="descripcion"
            rows="4"
          >
        </textarea>
        </div>

        <div class="form-group">
          <label>Categorías</label>
          <div class="categorias-container">
            @for (categoria of categorias; track categoria.nombre){
              <div
                class="categoria-item"
                (click)="toggleCategoria(categoria.nombre)"
                [class.selected]="isCategoriaSeleccionada(categoria.nombre)"
              >
                <input
                  type="checkbox"
                  [checked]="isCategoriaSeleccionada(categoria.nombre)"
                  [id]="'categoria-' + categoria.nombre"
                  readonly
                />
                <label [for]="'categoria-' + categoria.nombre">{{
                    categoria.nombre
                  }}</label>
              </div>
            }
          </div>
          <small
            *ngIf="categoriasSeleccionadas.length === 0"
            class="error-message"
          >
            Debe seleccionar al menos una categoría
          </small>
        </div>

        <div class="form-group">
          <label for="correoElectronico">Correo Electrónico</label>
          <input
            type="email"
            id="correoElectronico"
            name="correoElectronico"
            placeholder="Ingrese el correo electrónico"
            formControlName="correoElectronico"
            required
          />
        </div>

        <div class="form-group">
          <label for="contraseña">Contraseña</label>
          <input
            type="password"
            id="contraseña"
            name="contraseña"
            placeholder="Ingrese la contraseña"
            formControlName="contraseña"
            required
          />
        </div>

        <div class="form-actions">
          <button type="reset" class="btn-secondary">Restaurar</button>
          <button
            [disabled]="!distribuidoraForm.valid || categoriasSeleccionadas.length === 0"
            type="submit"
            class="btn-primary"
          >
            Guardar Cambios
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
