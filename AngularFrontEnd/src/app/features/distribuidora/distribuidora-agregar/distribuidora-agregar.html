<div class="container">
  <h2>Agregar Nueva Distribuidora</h2>
  
  <form [formGroup]="distribuidoraForm" (ngSubmit)="handleSubmit()" class="distribuidora-form">
    <div class="form-group">
      <label for="cuit">CUIT</label>
      <input 
        type="text" 
        id="cuit" 
        name="cuit" 
        placeholder="Ingrese el CUIT (ej: 20-12345678-9)"
        formControlName="cuit"
        required>
    </div>

    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input 
        type="text" 
        id="nombre" 
        name="nombre" 
        placeholder="Ingrese el nombre de la distribuidora"
        formControlName="nombre"
        required>
    </div>

    <div class="form-group">
      <label for="direccion">Dirección</label>
      <input 
        type="text" 
        id="direccion" 
        name="direccion" 
        placeholder="Ingrese la dirección completa"
        formControlName="direccion"
        required>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="numeroTelefono">Número de Teléfono</label>
        <input 
          type="tel" 
          id="numeroTelefono" 
          name="numeroTelefono" 
          placeholder="Ingrese el número de teléfono"
          formControlName="numeroTelefono"
          required>
      </div>

      <div class="form-group">
        <label for="codigoPostal">Código Postal</label>
        <input 
          type="text" 
          id="codigoPostal" 
          name="codigoPostal" 
          placeholder="Ingrese el código postal"
          formControlName="codigoPostal"
          required>
      </div>
    </div>

    <div class="form-group">
      <label for="descripcion">Descripción</label>
      <input 
        id="descripcion" 
        name="descripcion" 
        placeholder="Ingrese una descripción de la distribuidora"
        rows="4"
        formControlName="descripcion"
        required>
    </div>

    <div class="form-group">
      <label for="descripcion">Correo electronico</label>
      <input 
        id="correoElectronico" 
        name="correoElectronico" 
        placeholder="Ingrese un correo electronico"
        rows="4"
        formControlName="correoElectronico"
        required>
    </div>

    <div class="form-actions">
      <button [disabled]="!distribuidoraForm.valid" type="submit" class="btn-primary">Agregar Distribuidora</button>
      <button type="reset" class="btn-secondary">Limpiar</button>
    </div>
  </form>
</div>
